# 运行配置示例。复制为 agent.toml 后按部署环境调整；实际 agent.toml 只保存在本机。

[server]
bind_addr = "127.0.0.1:8080"
web_dist_dir = "./web/dist"
# JSONL event store for the single-process API adapter. A database adapter can replace it later.
event_store_dir = "./data/events"
user_store_path = "./data/users.json"
# Set true whenever the Web console is served over HTTPS.
web_cookie_secure = false
# Optional Unix-domain socket for the separate `koi-console` management client.
# The systemd unit sets KOI_ADMIN_SOCKET_PATH=/run/koi-rust-rv/koi-admin.sock instead.
# admin_socket_path = "./data/koi-admin.sock"

[logging]
# 按天滚动的结构化日志目录；相对路径相对于 koi-server 工作目录。
directory = "./data/logs"
# debug 会记录完整模型请求、供应商原始响应和流式中间输出（包括 reasoning summary）。
# `level` 控制持久化文件日志；可用环境变量 RUST_LOG 临时调整控制台日志，例如 RUST_LOG=info。
level = "debug"

[qq]
# QQ 开放平台机器人凭证；也可以使用 QQ_BOT_APP_ID / QQ_BOT_APP_SECRET 环境变量。
app_id = ""
app_secret = ""
api_base_url = "https://api.sgroup.qq.com"
# GROUP_AND_C2C_EVENT (1 << 25)。启用全量群消息权限后，机器人可旁听群聊。
intents = 33554432
request_timeout_secs = 10
max_retries = 2
reconnect_base_delay_ms = 1000
reconnect_max_delay_ms = 30000
# 群消息只接收明确 @ 机器人的内容；GROUP_AT_MESSAGE_CREATE 始终接收。
mention_only = true
# 可选：主要汇报群的 group_openid；配置后模型可使用 qq.report 向该群汇报。
# report_group_openid = ""
default_permission = "User"
max_reply_chars = 1500

[models]
# 模型供应商与 API Key 位于独立 models.toml；默认直接在 koi-server 中调用。
config_path = "config/models.toml"

[models.proxy]
# 启用后，koi-server 不读取 models.toml，转而请求独立运行的 koi-model-proxy。
enabled = false
base_url = "http://127.0.0.1:9510"
request_timeout_secs = 300
# token = "代理调用令牌；生产环境建议使用 KOI_MODEL_PROXY_TOKEN"

[agent]
max_steps = 128
max_concurrent_tasks = 8
max_tasks_per_server = 8
task_timeout_secs = 3600
# 单个任务累计输入与输出 Token 的硬预算；达到后自动停止模型循环。删除该字段表示不限制。
token_budget_per_task = 1200000

# 内置基础服务监测。监测器只在状态变化时向主会话写入 firing/resolved 告警。
[monitor]
enabled = false
instance = "local"
interval_secs = 30
timeout_secs = 5
failure_threshold = 3
recovery_threshold = 2

[[monitor.checks]]
id = "koi-api"
kind = "http"
target = "http://127.0.0.1:8080/healthz"
name = "Koi API"
description = "检查 Koi API 健康端点是否可达并返回预期状态码"
severity = "critical"
expected_status = 200

# 外部 Alertmanager 或其他监控系统使用该入口；密钥也可通过 KOI_ALERT_WEBHOOK_TOKEN 提供。
[alerts]
webhook_source = "alertmanager"
# webhook_token = "change-me"

[context]
recent_group_messages = 32
intervention_cooldown_secs = 300
alert_dedup_window_secs = 600

[storage]
database_url = "sqlite://data/koi.db?mode=rwc"

[usage]
# 以下价格均为美元 / 1,000,000 Token。缓存命中价格只计入命中的输入 Token，
# 普通输入价格只计入未命中的输入 Token，输出价格计入输出 Token。
input_price_per_million_tokens = 0.0
cached_input_price_per_million_tokens = 0.0
output_price_per_million_tokens = 0.0
monthly_budget_usd = 10.0

[notifications]
notify_severity_at_or_above = "warning"
max_reply_chars = 1500
