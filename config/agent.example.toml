# 运行配置示例。复制为 agent.toml 后按部署环境调整；实际 agent.toml 只保存在本机。

[server]
bind_addr = "127.0.0.1:8080"
web_dist_dir = "./web/dist"
# JSONL event store for the single-process API adapter. A database adapter can replace it later.
event_store_dir = "./data/events"
user_store_path = "./data/users.json"
# Set true whenever the Web console is served over HTTPS.
web_cookie_secure = false
[qq]
api_base_url = "https://api.bot.qq.com"
# GROUP_AND_C2C_EVENT (1 << 25)。启用全量群消息权限后，机器人可旁听群聊。
intents = 33554432
request_timeout_secs = 10
max_retries = 2

[models]
# 会话未显式选择模型时使用这组供应商和供应商模型 ID。
default_provider = "openai"
default_model_id = "gpt-5-mini"

[[models.entries]]
provider = "openai"
base_url = "https://api.openai.com/v1"
model_id = "gpt-5-mini"
# 当前模型的供应商 API 密钥；没有鉴权的本地网关可以留空。
api_key = ""
protocol = "responses" # responses 或 chat_completions；学校接口可切换为 chat_completions
request_timeout_secs = 60
context_window_tokens = 32768
max_output_tokens = 4096
reasoning_effort = "medium"

[[models.entries]]
# 同一个模型 ID 可以由不同供应商分别提供；控制事件始终携带两者。
provider = "deepseek"
base_url = "https://api.deepseek.com/v1"
model_id = "deepseek-chat"
# 当前模型的供应商 API 密钥；只写入本机 agent.toml，不要提交。
api_key = ""
protocol = "responses"
request_timeout_secs = 30
context_window_tokens = 16384
max_output_tokens = 4096
reasoning_effort = "low"

[agent]
max_steps = 8
max_concurrent_tasks = 4
max_tasks_per_server = 2
task_timeout_secs = 180
token_budget_per_task = 12000

[context]
recent_group_messages = 32
intervention_cooldown_secs = 300
alert_dedup_window_secs = 600

[storage]
database_url = "sqlite://data/koi.db?mode=rwc"

[usage]
input_price_per_million_tokens = 0.0
output_price_per_million_tokens = 0.0
monthly_budget_usd = 10.0

[security]
# 结构化文件、Git、归档和 Compose 工具只能访问这些根目录。
allowed_roots = ["./data", "./config"]
# 仅列出允许执行诊断工具的本机服务；不要开放任意 shell。
allowed_services = ["koi-demo.service"]
# HTTP 工具只允许访问列出的主机名；空数组表示全部拒绝。
allowed_http_hosts = []
allowed_database_targets = []
allow_mutating_tools = false
allow_admin_commands = false
use_sudo = true
approval_timeout_secs = 300

[notifications]
notify_severity_at_or_above = "warning"
max_reply_chars = 1500
